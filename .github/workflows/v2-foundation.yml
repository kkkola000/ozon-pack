name: V2 foundation

on:
  push:
    branches: [refactor/modular-architecture]
    paths: ['v2/**', '.github/workflows/v2-foundation.yml']
  pull_request:
    paths: ['v2/**', '.github/workflows/v2-foundation.yml']

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pack_v2
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pack_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pack_v2 -d pack_v2_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PACK_V2_TEST_DATABASE_URL: postgresql+psycopg://pack_v2:ci-only-password@127.0.0.1:5432/pack_v2_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r v2/requirements-dev.lock
      - run: python -m pip install --no-deps -e v2
      - run: ruff check v2/src v2/tests
      - run: ruff format --check v2/src v2/tests
      - run: python -m pytest -c v2/pyproject.toml v2/tests
