name: Deployment security

on:
  push:
    branches: [codex/nginx-ip-access]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and nginx
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
      - name: Run tests including root-only deployment checks
        run: sudo env PATH="$PWD/.venv/bin:$PATH" PYTHONPATH="$PWD" "$PWD/.venv/bin/python" -m pytest -q
