# Настройки линтера. Запуск: ruff check app tests
#
# Смысл набора — ловить настоящие находки (мёртвый код, ошибки, лишние
# переменные), а не переписывать стиль уже написанного кода. Поэтому часть
# правил выключена осознанно, с объяснением: иначе полезные предупреждения
# тонут в сотне шумных.
target-version = "py311"

[lint]
select = ["F", "E", "W", "B", "SIM", "UP", "ARG", "C901"]
ignore = [
    # Depends(...) и Body(...) в значениях по умолчанию — это и есть способ
    # объявить зависимость в FastAPI, а не ошибка (95 ложных срабатываний).
    "B008",
    # Длина строк в проекте не выравнивалась и выравнивать её задним числом
    # незачем — диффы станут нечитаемыми.
    "E501",
    # timezone.utc -> datetime.UTC: работает одинаково, смысла в массовой
    # замене нет.
    "UP017",
]

[lint.per-file-ignores]
# В маршрутах аргументы вида `user: dict = Depends(current_user)` часто не
# используются в теле: они стоят там как проверка доступа. Убрать «лишний»
# аргумент — значит убрать проверку, поэтому ARG001 здесь выключен.
"app/routes/*" = ["ARG001"]
# В тестах импорт внутри функции — приём изоляции, а не небрежность.
# Фикстуры pytest часто запрашиваются ради побочного эффекта (загрузить
# данные, поднять кабинет) и в теле теста не упоминаются.
"tests/*" = ["ARG001", "ARG002", "PLC0415"]
