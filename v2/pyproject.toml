[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-pack-v2"
version = "2.0.0a15"
description = "Modular foundation for the warehouse panel"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "SQLAlchemy==2.0.58",
  "alembic==1.20.1", "psycopg[binary]==3.3.9", "argon2-cffi==25.1.0",
  "pydantic-settings==2.16.3", "jinja2==3.1.6", "python-multipart==0.0.32",
  "itsdangerous==2.2.0", "cryptography==50.0.1",
  "httpx==0.28.1", "pypdf==6.16.2", "fpdf2==2.8.8", "zxing-cpp==3.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.6", "playwright==1.65.2"]

[project.scripts]
pack-v2 = "pack_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pack_v2 = ["web/templates/*.html", "web/static/*", "web/static/vendor/*", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
