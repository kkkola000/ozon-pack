services:
  ozon-pack:
    build: .
    image: ozon-pack:latest
    container_name: ozon-pack
    restart: unless-stopped
    ports:
      # Адрес публикации берётся из .env (BIND_ADDR), по умолчанию — все
      # интерфейсы: панель открывается по http://IP-сервера:8080.
      #
      # Когда перед панелью встаёт nginx (deploy/ssl.sh) или доступ
      # ограничивается сетью VPN (deploy/vpn-only.sh), скрипты пишут в .env
      # BIND_ADDR=127.0.0.1 — тогда порт виден только с самого сервера, и зайти
      # мимо nginx нельзя. Docker пишет правила в iptables в обход ufw, поэтому
      # закрыть этот порт файрволом не получится: помогает только адрес здесь.
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      # База, журнал сборки и ключ сессий переживают пересборку образа.
      # Контейнер работает под uid 10001, поэтому перед первым запуском:
      #   mkdir -p data && sudo chown -R 10001:10001 data
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
