# Необязательный обратный прокси: панель на 80 порту вместо 8080.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ozon-pack
#   sudo ln -s /etc/nginx/sites-available/ozon-pack /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    server_name _;

    # Стикеры и листы возвратов бывают крупными
    client_max_body_size 20m;

    # Доступ только со своих адресов (раскомментируйте и укажите свои):
    # allow 203.0.113.10;
    # allow 192.168.1.0/24;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
